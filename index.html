<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兰泽诗词</title>
    <meta name="description" content="兰泽诗词：古诗词阅读、检索、摘录与社区创作演示">
    <style>
        @media screen and (min-width:1400px) {
            html {
                font-size: 20px;
            }
        }

        @media screen and (max-width:1400px) and (min-width:1200px) {
            html {
                font-size: 13px;
            }
        }

        @media screen and (max-width:1200px) and (min-width:992px) {
            html {
                font-size: 10px;
            }
        }

        @media screen and (max-width:992px) and (min-width:768px) {
            html {
                font-size: 16px;
            }
        }

        @media screen and (max-width:768px) and (min-width:576px) {
            html {
                font-size: 15px;
            }
        }

        @media screen and (max-width:576px) and (min-width:370px) {
            html {
                font-size: 11px;
            }
        }

        @media screen and (max-width:370px) and (min-width:29px) {
            html {
                font-size: 9px;
            }
        }

        @media screen and (max-width:290px) and (min-width:200px) {
            html {
                font-size: 7px;
            }
        }

        body {
            overflow: hidden;
            margin: 0;
        }

        .el-tabs__item {
            width: 6rem;
            text-align: center;
        }

        /* 修改element plus的加载颜色 */
        .el-loading-spinner .path {
            stroke: #5b99af !important;
        }
        .el-loading-spinner .el-loading-text {
            color: #5b99af !important;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
