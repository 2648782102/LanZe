name: 功能 / 改进建议
description: 提议前端体验、文档、CI、mock 数据或可替换 API 的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 `README.md`、`docs/ROADMAP.md` 与 `CONTRIBUTING.md`。路线图是优先级参考，不是交付承诺；提案越小、越容易验证，越适合成为 `good first issue`。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用者/贡献者遇到的具体障碍，以及受影响页面或文档。
      placeholder: 示例：没有后端时搜索页无限 loading，新人无法判断是配置问题还是代码缺陷。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明最小改动、涉及目录与对其他模块的影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
      description: 列出你考虑过的其他方案，以及为什么不选；没有可写「暂无」。
  - type: dropdown
    id: scope
    attributes:
      label: 主要范围
      options:
        - 文档 / 展示
        - CI / 工程化
        - 前端交互 / 样式
        - mock / API 适配
        - 测试 / 可访问性
        - 内容 / 素材授权
        - 其他
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的验收标准
      description: 例如命令、页面路径、mock 开关、Node 版本、预期错误态。
      placeholder: |
        - [ ] `npm run test --if-present` 通过
        - [ ] `VITE_ENABLE_MOCK=true` 时断网仍显示演示数据
        - [ ] README / CHANGELOG 同步更新
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已检查 `docs/ROADMAP.md` 与现有 issue，避免重复。
          required: true
        - label: 提案不依赖未验证的线上 Demo、付费服务或私密基础设施。
          required: true
