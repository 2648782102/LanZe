name: 文档 / 展示问题
description: 报告 README、docs、Release 草稿、宣发文案或仓库展示中的错误
title: "[Docs] "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: 位置
      description: 文件路径、章节、链接，或 GitHub About/Release/Discussion 的对应位置。
      placeholder: "`README.md` → 快速开始 / `docs/DEPLOYMENT.md` → GitHub Pages"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 问题是什么
      description: 是命令失效、与源码不一致、链接失效、表述夸大、翻译问题，还是格式问题？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 依据 / 实际结果
      description: 提供 commit SHA、`package.json` 片段、命令输出或已验证链接；不要粘贴密钥。
  - type: textarea
    id: suggestion
    attributes:
      label: 建议修改
      description: 给出可直接替换的文字或最小 diff；若涉及源码，请说明是否需要同步开发/部署文档。
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已核对当前 `main` 分支文件，而不是旧 README 或历史快照。
          required: true
        - label: 不会恢复已失效的历史展示地址作为线上 Demo。
          required: true
