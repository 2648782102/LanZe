name: Publish v0.4.0

on:
  push:
    tags:
      - "v0.4.0"

permissions:
  contents: write
  discussions: write

concurrency:
  group: publish-v0.4.0
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release and welcome discussion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_TITLE: 兰泽诗词 v0.4.0 · 离线馆藏与声景曲库
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi

      - name: Create or update welcome discussion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISCUSSION_TITLE: 欢迎参与兰泽诗词的重新整理 👋
          DISCUSSION_URL: https://github.com/2648782102/LanZe/discussions/1
        shell: bash
        run: |
          set -euo pipefail

          owner="${REPOSITORY%/*}"
          repo="${REPOSITORY#*/}"
          desired_body="$(< ANNOUNCEMENT.md)"

          graphql() {
            local response
            response="$(
              curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                https://api.github.com/graphql \
                --data-binary @-
            )" || return 1
            printf '%s' "$response" | jq -e '
              if (.errors // [] | length) > 0 then
                error((.errors[0].message // "GraphQL request failed"))
              else
                .
              end'
          }

          category_id="$(
            jq -n \
              --arg owner "$owner" \
              --arg name "$repo" \
              '{query: "query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { discussionCategories(first: 50) { nodes { id name } } } }", variables: {owner: $owner, name: $name}}' \
              | graphql \
              | jq -r '[.data.repository.discussionCategories.nodes[]? | select(.name == "Announcements") | .id][0] // empty'
          )"
          test -n "$category_id" || { echo "Announcements category not found" >&2; exit 1; }

          repository_id="$(
            jq -n \
              --arg owner "$owner" \
              --arg name "$repo" \
              '{query: "query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { id } }", variables: {owner: $owner, name: $name}}' \
              | graphql \
              | jq -r '.data.repository.id // empty'
          )"
          test -n "$repository_id" || { echo "Repository id not found" >&2; exit 1; }

          existing_id="$(
            jq -n \
              --arg owner "$owner" \
              --arg name "$repo" \
              --arg category "$category_id" \
              '{query: "query($owner: String!, $name: String!, $category: ID!) { repository(owner: $owner, name: $name) { discussions(first: 50, categoryId: $category) { nodes { id title } } } }", variables: {owner: $owner, name: $name, category: $category}}' \
              | graphql \
              | jq -r --arg title "$DISCUSSION_TITLE" '[.data.repository.discussions.nodes[]? | select(.title == $title) | .id][0] // empty'
          )"

          if [ -n "$existing_id" ]; then
            current_body="$(
              jq -n \
                --arg id "$existing_id" \
                '{query: "query($id: ID!) { node(id: $id) { ... on Discussion { title body } } }", variables: {id: $id}}' \
                | graphql \
                | jq -r '.data.node.body // empty'
            )"
            desired_body_without_trailing_newlines="${desired_body%"$'\n'"}"
            if [ "$current_body" = "$desired_body_without_trailing_newlines" ]; then
              echo "Welcome discussion is already current: $DISCUSSION_URL"
              exit 0
            fi

            update_request="$(
              jq -n \
                --arg query 'mutation($input: UpdateDiscussionInput!) { updateDiscussion(input: $input) { discussion { id url } } }' \
                --arg discussion "$existing_id" \
                --arg title "$DISCUSSION_TITLE" \
                --rawfile body ANNOUNCEMENT.md \
                '{query: $query, variables: {input: {discussionId: $discussion, title: $title, body: $body}}}'
            )"
            if ! update_response="$(
              printf '%s' "$update_request" | curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                https://api.github.com/graphql \
                --data-binary @-
            )"; then
              echo "Discussion update request failed" >&2
              exit 1
            fi
            if ! update_error="$(printf '%s' "$update_response" | jq -r '.errors[0].message // empty')"; then
              echo "Discussion update returned an invalid response" >&2
              exit 1
            fi
            if [ -n "$update_error" ]; then
              if [[ "$update_error" == *"Resource not accessible by integration"* ]]; then
                echo "::warning::Could not update $DISCUSSION_URL with the current GITHUB_TOKEN; the existing discussion was left unchanged. Update it manually or configure an explicitly permitted token." >&2
                exit 0
              fi
              echo "Discussion update failed: $update_error" >&2
              exit 1
            fi
            printf '%s' "$update_response" \
              | jq -er '.data.updateDiscussion.discussion // error("Discussion update returned no discussion") | "Updated discussion \(.id): \(.url)"'
          else
            jq -n \
              --arg query 'mutation($input: CreateDiscussionInput!) { createDiscussion(input: $input) { discussion { id url } } }' \
              --arg repository "$repository_id" \
              --arg category "$category_id" \
              --arg title "$DISCUSSION_TITLE" \
              --rawfile body ANNOUNCEMENT.md \
              '{query: $query, variables: {input: {repositoryId: $repository, categoryId: $category, title: $title, body: $body}}}' \
              | graphql \
              | jq -er '.data.createDiscussion.discussion // error("Discussion creation returned no discussion") | "Created discussion \(.id): \(.url)"'
          fi
