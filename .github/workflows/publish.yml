name: Publish v0.2.0

on:
  push:
    tags:
      - "v0.2.0"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

concurrency:
  group: publish-v0.2.0
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release and welcome discussion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v0.2.0
          RELEASE_TITLE: 兰泽诗词 v0.2.0 · 本地可运行的开源前端
        shell: bash
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG_NAME" \
              --title "$RELEASE_TITLE" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi

      - name: Create welcome discussion if absent
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISCUSSION_TITLE: 欢迎参与兰泽诗词的重新整理 👋
        shell: bash
        run: |
          set -euo pipefail

          owner="${REPOSITORY%/*}"
          repo="${REPOSITORY#*/}"

          graphql() {
            local response
            response="$(
              curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                https://api.github.com/graphql \
                --data-binary @-
            )" || return 1
            printf '%s' "$response" | jq -e '
              if (.errors // [] | length) > 0 then
                error((.errors[0].message // "GraphQL request failed"))
              else
                .
              end'
          }

          category_id="$(
            jq -n \
              --arg owner "$owner" \
              --arg name "$repo" \
              '{query: "query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { discussionCategories(first: 50) { nodes { id name } } } }", variables: {owner: $owner, name: $name}}' \
              | graphql \
              | jq -r '[.data.repository.discussionCategories.nodes[]? | select(.name == "Announcements") | .id][0] // empty'
          )"
          test -n "$category_id" || { echo "Announcements category not found" >&2; exit 1; }

          repository_id="$(
            jq -n \
              --arg owner "$owner" \
              --arg name "$repo" \
              '{query: "query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { id } }", variables: {owner: $owner, name: $name}}' \
              | graphql \
              | jq -r '.data.repository.id // empty'
          )"
          test -n "$repository_id" || { echo "Repository id not found" >&2; exit 1; }

          existing_id="$(
            jq -n \
              --arg owner "$owner" \
              --arg name "$repo" \
              --arg category "$category_id" \
              '{query: "query($owner: String!, $name: String!, $category: ID!) { repository(owner: $owner, name: $name) { discussions(first: 50, categoryId: $category) { nodes { id title } } } }", variables: {owner: $owner, name: $name, category: $category}}' \
              | graphql \
              | jq -r --arg title "$DISCUSSION_TITLE" '[.data.repository.discussions.nodes[]? | select(.title == $title) | .id][0] // empty'
          )"

          if [ -n "$existing_id" ]; then
            echo "Welcome discussion already exists: $existing_id"
            exit 0
          fi

          jq -n \
            --arg query 'mutation($input: CreateDiscussionInput!) { createDiscussion(input: $input) { discussion { id url } } }' \
            --arg repository "$repository_id" \
            --arg category "$category_id" \
            --arg title "$DISCUSSION_TITLE" \
            --rawfile body ANNOUNCEMENT.md \
            '{query: $query, variables: {input: {repositoryId: $repository, categoryId: $category, title: $title, body: $body}}}' \
            | graphql \
            | jq -er '.data.createDiscussion.discussion // error("Discussion creation returned no discussion") | "Created discussion \(.id): \(.url)"'
