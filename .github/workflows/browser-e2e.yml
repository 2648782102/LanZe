name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Chromium CDP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
          install-chromedriver: false

      - name: Verify Chrome availability
        shell: bash
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Browser smoke
        run: npm run smoke:browser

      - name: Accessibility audit (axe-core)
        run: npm run audit:a11y

      - name: Performance budget (LCP / CLS / initial JS-CSS)
        run: npm run audit:perf

      - name: Touch target audit (mobile)
        run: npm run audit:touch | tee touch-audit.json

      - name: Upload touch audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: touch-audit
          path: touch-audit.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Mobile visual regression
        run: npm run audit:visual

      - name: Mobile layout contract
        run: npm run audit:layout | tee layout-contract-report.json

      - name: Motion audit (tokens, reduced-motion, lazy load)
        run: npm run audit:motion

      - name: Upload layout contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-contract
          path: layout-contract-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: tests/visual/.actual
          retention-days: 7
          if-no-files-found: ignore
