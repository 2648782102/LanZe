name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (if script exists)
        run: npm run test --if-present

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/index.html
          npm run smoke

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint
        run: npm run lint

      - name: Check required files
        shell: bash
        run: |
          for file in \
            README.md \
            LICENSE \
            CONTRIBUTING.md \
            CODE_OF_CONDUCT.md \
            SECURITY.md \
            CHANGELOG.md \
            docs/ARCHITECTURE.md \
            docs/DEVELOPMENT.md \
            docs/DEPLOYMENT.md \
            docs/ROADMAP.md \
            docs/FAQ.md \
            docs/PROMOTION.md \
            docs/THIRD_PARTY_ASSETS.md \
            docs/DESIGN_SYSTEM.md \
            .github/PULL_REQUEST_TEMPLATE.md \
            .github/workflows/ci.yml \
            .github/workflows/browser-e2e.yml \
            .github/workflows/pages.yml \
            .github/workflows/publish.yml
          do
            test -f "$file" || { echo "Missing required file: $file" >&2; exit 1; }
          done

      - name: Check license consistency
        shell: bash
        run: |
          grep -q 'MIT License' LICENSE
          grep -q '2022-2026 LanZe contributors' LICENSE
          grep -q 'MIT' README.md

      - name: Reject stale demo claims
        shell: bash
        run: |
          if grep -nE 'app\.memfiredb\.com|lanze-node\.vercel\.app|lan-ze-user\.vercel\.app|项目展示地址[:：]' README.md; then
            echo 'README contains a historical endpoint presented as a live demo.' >&2
            exit 1
          fi

      - name: Reject legacy UI dependencies
        shell: bash
        run: |
          for package in element-plus bootstrap @fortawesome/fontawesome-free aplayer vue3-puzzle-vcode lottie-web; do
            if grep -q "\"$package\"" package.json; then
              echo "$package must not return to the independent UI layer." >&2
              exit 1
            fi
          done
          if grep -nE 'cdn\.staticfile\.org|cdn\.bootcss\.com' index.html; then
            echo 'index.html still references a legacy third-party style CDN.' >&2
            exit 1
          fi

      - name: Reject third-party media defaults
        shell: bash
        run: |
          if grep -nE 'music\.163\.com|music\.126\.net' src/components/AudioDock.vue src/config/audio.js; then
            echo 'The default audio player still hardcodes third-party media hosts.' >&2
            exit 1
          fi
          test -f public/media/lanze-demo.wav
          test -f public/media/lanze-demo-cover.svg

      - name: Check optimized local assets
        shell: bash
        run: |
          test -f src/assets/fonts/LanZeSong-subset.woff2
          test -f src/assets/exhibit/songci300-768.jpg
          test -f src/assets/exhibit/auth-cover-960.jpg
          test "$(wc -c < src/assets/fonts/LanZeSong-subset.woff2)" -lt 250000
          test "$(wc -c < src/assets/exhibit/songci300-768.jpg)" -lt 100000
          test "$(wc -c < src/assets/exhibit/auth-cover-960.jpg)" -lt 180000
