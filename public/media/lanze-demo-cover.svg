<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">兰泽诗词演示音源封面</title>
  <desc id="desc">水墨圆形与五条抽象琴弦，作为仓库自制演示音源的封面。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e3" />
      <stop offset="1" stop-color="#e7dcc6" />
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#355b4b" />
      <stop offset="1" stop-color="#18372d" />
    </linearGradient>
  </defs>
  <rect width="320" height="320" fill="url(#paper)" />
  <circle cx="160" cy="160" r="122" fill="url(#ink)" opacity="0.92" />
  <circle cx="160" cy="160" r="108" fill="none" stroke="#f7f1e3" stroke-opacity="0.32" stroke-width="2" />
  <g stroke="#f7f1e3" stroke-linecap="round" opacity="0.8">
    <path d="M74 112 Q160 92 246 112" stroke-width="2" />
    <path d="M70 136 Q160 118 250 136" stroke-width="2" />
    <path d="M68 160 Q160 144 252 160" stroke-width="2" />
    <path d="M70 184 Q160 168 250 184" stroke-width="2" />
    <path d="M74 208 Q160 192 246 208" stroke-width="2" />
  </g>
  <circle cx="160" cy="160" r="38" fill="#f7f1e3" opacity="0.94" />
  <text x="160" y="174" text-anchor="middle" font-family="serif" font-size="34" fill="#24493c">兰泽</text>
  <text x="160" y="270" text-anchor="middle" font-family="serif" font-size="15" letter-spacing="4" fill="#355b4b">本地演示音源</text>
</svg>
