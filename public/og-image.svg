    </g>
    <line x1="56" y1="181" x2="304" y2="181" stroke="#ded4b9" stroke-width="2"/>
    <text x="56" y="224" fill="#8a7b5c" font-family="PingFang SC, sans-serif" font-size="20">摘录 · 文库 · 茶楼 · 笃学</text>
    <circle cx="292" cy="260" r="18" fill="#b34f42" opacity="0.85"/>
    <text x="282" y="267" fill="#fff7ec" font-family="serif" font-size="17">泽</text>
